*, *::before, *::after { box-sizing: border-box; }

body {

body::before {

  border: 1px solid rgba(29,185,84,0.4);

  padding: 0.45rem 0.9rem;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.copy-btn:hover  { background: rgba(29,185,84,0.25); }
.copy-btn.copied { background: rgba(29,185,84,0.3); color: #fff; }

.claim-btn {

  transition: background 0.15s, opacity 0.15s;

}
.claim-btn:hover:not(:disabled) { background: #1ed760; }
.claim-btn:disabled {

/* Status messages */
.status-box {
  margin-top: 1.1rem;

.status-box.success {

.spinner {

@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {

}

<script>
/* ─── Config ─── */
// Replace this with your Cloudflare Worker URL after deploying
const WORKER_URL = 'https://jerkmate-email.v1nc1txt.workers.dev';

/* ─── Background hover ─── */
const body = document.body;
document.querySelectorAll('.spotify-embed').forEach(embed => {
  embed.addEventListener('mouseenter', () => {
    body.style.setProperty('--bg-url', `url(${embed.dataset.cover})`);
    body.classList.add('show-bg');
  });
});
window.addEventListener('load', () => {
  ['cassette1','cassette2','cassette3','cassette4','cassette5'].forEach(n => {
    const img = new Image(); img.src = `images/${n}.jpg`;
  });
});

/* ─── Email form ─── */
const usernameInput = document.getElementById('usernameInput');
const forwardInput  = document.getElementById('forwardInput');
const usernameRow   = document.getElementById('usernameRow');
const forwardRow    = document.getElementById('forwardRow');
const usernameError = document.getElementById('usernameError');
const forwardError  = document.getElementById('forwardError');
const previewRow    = document.getElementById('previewRow');
const previewAddr   = document.getElementById('previewAddress');
const claimBtn      = document.getElementById('claimBtn');
const loadingBox    = document.getElementById('loadingBox');
const successBox    = document.getElementById('successBox');
const errorBox      = document.getElementById('errorBox');

let usernameValid = false;
let forwardValid  = false;

function validateUsername(raw) {
  const val = raw.trim();
  if (!val)       return '';
  if (val.length < 2)  return 'At least 2 characters.';
  if (val.length > 40) return 'Max 40 characters.';
  if (!/^[a-zA-Z0-9]/.test(val))  return 'Must start with a letter or number.';
  if (!/[a-zA-Z0-9]$/.test(val))  return 'Must end with a letter or number.';
  if (!/^[a-zA-Z0-9._-]+$/.test(val)) return 'Only letters, numbers, . _ or -.';
  if (/[._-]{2,}/.test(val)) return 'No consecutive . _ or -.';
  return '';
}

function validateEmail(val) {
  if (!val.trim()) return '';
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim()) ? '' : 'Enter a valid email address.';
}

function updateUI() {
  const err = validateUsername(usernameInput.value);
  usernameValid = usernameInput.value.trim().length >= 2 && !err;
  usernameError.textContent = err;
  usernameRow.classList.toggle('error', !!err && usernameInput.value.trim().length > 0);

  if (usernameValid) {
    previewAddr.textContent = usernameInput.value.trim().toLowerCase() + '@jerkmate.lol';
    previewRow.classList.add('visible');
  } else {
    previewRow.classList.remove('visible');
  }

  const ferr = validateEmail(forwardInput.value);
  forwardValid = forwardInput.value.trim().length > 0 && !ferr;
  forwardError.textContent = ferr;
  forwardRow.classList.toggle('error', !!ferr && forwardInput.value.trim().length > 0);

  claimBtn.disabled = !(usernameValid && forwardValid);
}

usernameInput.addEventListener('input', updateUI);
forwardInput.addEventListener('input', updateUI);

function showStatus(type, html) {
  loadingBox.style.display  = 'none';
  successBox.style.display  = 'none';
  errorBox.style.display    = 'none';
  if (type === 'loading') { loadingBox.style.display = 'flex'; }
  else if (type === 'success') { successBox.innerHTML = html; successBox.style.display = 'block'; }
  else if (type === 'error')   { errorBox.innerHTML   = html; errorBox.style.display   = 'block'; }
}

async function claimEmail() {
  const username  = usernameInput.value.trim().toLowerCase();
  const forwardTo = forwardInput.value.trim().toLowerCase();

  claimBtn.disabled = true;
  showStatus('loading');

  try {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, forwardTo }),
    });
    const data = await resp.json();

    if (data.success) {
      showStatus('success',
        `✅ <strong>${data.alias}</strong> is yours!<br>
         Check <strong>${forwardTo}</strong> for a verification email from Cloudflare — click the link to activate it.`
      );
      usernameInput.disabled = true;
      forwardInput.disabled  = true;
    } else {
      showStatus('error', `❌ ${data.error || 'Something went wrong. Try again.'}`);
      claimBtn.disabled = false;
    }
  } catch {
    showStatus('error', '❌ Could not reach the server. Try again in a moment.');
    claimBtn.disabled = false;
  }
}

function copyEmail() {
  const addr = previewAddr.textContent;
  if (!addr) return;
  navigator.clipboard.writeText(addr).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}
</script>
