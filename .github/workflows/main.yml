name: Make share pages

on:
  push:
    paths:
      - links.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python make_pages.py
      - run: |
          mkdir -p track
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add track
          git diff --cached --quiet || git commit -m "update share pages"
          git push
